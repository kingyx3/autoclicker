name: Android emulator smoke
on:
  push:
  pull_request:
jobs:
  launch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: gradle :app:assembleDebug
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n io.github.kingyx3.autoclicker/.MainActivity
            sleep 3
            adb shell pidof io.github.kingyx3.autoclicker
            adb shell settings put secure enabled_accessibility_services io.github.kingyx3.autoclicker/.TapService
            adb shell settings put secure accessibility_enabled 1
            sleep 2
            adb shell dumpsys accessibility | grep -F 'io.github.kingyx3.autoclicker'
            adb exec-out screencap -p > android-smoke.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-screenshot
          path: android-smoke.png
          if-no-files-found: ignore
          retention-days: 7

name: Android build
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle :app:assembleDebug
      - name: Assert app code is packaged
        run: |
          python - <<'PY'
          import zipfile
          apk = 'app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as package:
              dex = b''.join(package.read(name) for name in package.namelist() if name.endswith('.dex'))
          assert b'Lio/github/kingyx3/autoclicker/MainActivity;' in dex
          assert b'Lio/github/kingyx3/autoclicker/TapService;' in dex
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: autoclicker-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
